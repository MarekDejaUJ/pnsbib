name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} R-${{ matrix.config.r }} Zig-${{ matrix.config.zig || '0.16.0' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: macos-latest, r: release, zig: '0.17.0'}
          - {os: windows-latest, r: release, zig: '0.17.0'}
          - {os: ubuntu-latest, r: release, zig: '0.17.0'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Empty selects the default automatic setup (Zig 0.16.0).
      PNSBIB_ZIG_VERSION: ${{ matrix.config.zig }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--no-manual")'
          error-on: '"warning"'
      - name: Report the compiler used by the check
        if: always()
        shell: bash
        run: grep -h "Compiling with Zig" check/*.Rcheck/00install.out || true
      - name: Native kernel tests
        shell: bash
        run: |
          cd src/rzig
          if [ "$RUNNER_OS" = "Windows" ]; then here="$(pwd -W)"; else here="$PWD"; fi
          ZIG_GLOBAL_CACHE_DIR="$here/.zig-global-cache" Rscript --vanilla ../../inst/toolchain/zig-toolchain.R \
            --build test --release=safe -j2 --summary all --cache-dir .zig-cache
